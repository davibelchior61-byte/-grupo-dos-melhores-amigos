                    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo dos Melhores Amigos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #ff9800;
            color: white;
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .group-avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #ddd;
            cursor: pointer;
            border: 3px solid white;
        }
        .group-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .container {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input, button, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #ff9800;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #e68900;
        }
        .member-list, .chat-section {
            text-align: left;
            margin-top: 20px;
        }
        .member-item {
            background: #fff3e0;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 5px solid #ff9800;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #ccc;
            flex-shrink: 0;
        }
        .member-info {
            flex-grow: 1;
        }
        .chat-box {
            border: 1px solid #ccc;
            height: 200px;
            border-radius: 5px;
            overflow-y: scroll;
            padding: 10px;
            background: #fafafa;
            margin-bottom: 10px;
        }
        .chat-msg {
            margin-bottom: 8px;
            padding: 5px 8px;
            background: #e0e0e0;
            border-radius: 4px;
            word-break: break-all;
        }
        .chat-msg img {
            max-width: 100%;
            border-radius: 4px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="group-avatar-container" onclick="document.getElementById('group-file-input').click()">
            <img id="group-avatar-img" src="" alt="Foto do Grupo" style="display:none;">
            <span id="group-avatar-placeholder" style="line-height:80px; font-size:12px; color:#555;">Foto</span>
        </div>
        <input type="file" id="group-file-input" accept="image/*" style="display:none" onchange="alterarFotoGrupo(event)">
        Grupo dos Melhores Amigos
    </header>

    <div id="login-screen" class="container">
        <h2>Digite a Senha do Grupo</h2>
        <input type="password" id="senha-input" placeholder="Senha de acesso">
        <button onclick="verificarSenha()">Entrar</button>
    </div>

    <div id="main-screen" class="container" style="display: none;">
        <h3>Grupo do Davi</h3>
        
        <div class="member-list">
            <h4>Membros do Grupo</h4>
            <input type="text" id="nome-input" placeholder="Nome do amigo">
            <input type="text" id="profissao-input" placeholder="Profissão do membro">
            <button onclick="adicionarMembro()">Adicionar Membro</button>
            
            <div id="lista-membros"></div>
        </div>

        <div class="chat-section">
            <h4>Chat do Grupo</h4>
            <div id="chat-box" class="chat-box"></div>
            <input type="text" id="chat-texto" placeholder="Digite sua mensagem...">
            <input type="file" id="chat-file-input" accept="image/*">
            <button onclick="enviarMensagem()">Enviar Mensagem</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.verificarSenha = function() {
            const senha = document.getElementById("senha-input").value;
            if (senha === "123Davi*") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-screen").style.display = "block";
                carregarTudo();
            } else {
                alert("Senha incorreta!");
            }
        };

        function comprimirImagem(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300;
                    const MAX_HEIGHT = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL("image/jpeg", 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.alterarFotoGrupo = function(event) {
            const file = event.target.files[0];
            if (file) {
                comprimirImagem(file, async function(base64Image) {
                    try {
                        await setDoc(doc(db, "config", "grupo"), { foto: base64Image }, { merge: true });
                        carregarFotoGrupo();
                    } catch (e) {
                        console.error("Erro ao salvar foto do grupo:", e);
                    }
                });
            }
        };

        async function carregarFotoGrupo() {
            try {
                const docSnap = await getDoc(doc(db, "config", "grupo"));
                if (docSnap.exists() && docSnap.data().foto) {
                    const imgElement = document.getElementById("group-avatar-img");
                    imgElement.src = docSnap.data().foto;
                    imgElement.style.display = "block";
                    document.getElementById("group-avatar-placeholder").style.display = "none";
                }
            } catch (e) {
                console.error("Erro ao carregar foto do grupo:", e);
            }
        }

        window.adicionarMembro = async function() {
            const nome = document.getElementById("nome-input").value;
            const profissao = document.getElementById("profissao-input").value;

            if (nome === "" || profissao === "") {
                alert("Preencha todos os campos!");
                return;
            }

            try {
                await addDoc(collection(db, "membros"), {
                    nome: nome,
                    profissao: profissao,
                    foto: ""
                });
                document.getElementById("nome-input").value = "";
                document.getElementById("profissao-input").value = "";
                carregarMembros();
            } catch (e) {
                console.error("Erro ao adicionar membro: ", e);
            }
        };

        window.gerenciarMembro = async function(id, nomeAtual) {
            const acao = prompt(`O que você quer fazer com ${nomeAtual}?\n1 - Adicionar/Alterar foto\n2 - Excluir membro`);
            if (acao === "1") {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = e => {
                    const file = e.target.files[0];
                    if (file) {
                        comprimirImagem(file, async function(base64Image) {
                            try {
                                await updateDoc(doc(db, "membros", id), { foto: base64Image });
                                carregarMembros();
                            } catch (err) {
                                console.error("Erro ao atualizar foto do membro:", err);
                            }
                        });
                    }
                };
                input.click();
            } else if (acao === "2") {
                if (confirm(`Tem certeza que deseja excluir ${nomeAtual}?`)) {
                    try {
                        await deleteDoc(doc(db, "membros", id));
                        carregarMembros();
                    } catch (err) {
                        console.error("Erro ao excluir membro:", err);
                    }
                }
            }
        };

        async function carregarMembros() {
            const listaDiv = document.getElementById("lista-membros");
            listaDiv.innerHTML = "Carregando...";
            
            try {
                const querySnapshot = await getDocs(collection(db, "membros"));
                listaDiv.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const fotoSrc = data.foto ? data.foto : "";
                    const avatarHtml = fotoSrc ? `<img src="${fotoSrc}" class="member-avatar">` : `<div class="member-avatar" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#555;">Foto</div>`;
                    
                    listaDiv.innerHTML += `
                        <div class="member-item" onclick="gerenciarMembro('${docSnap.id}', '${data.nome}')">
                            ${avatarHtml}
                            <div class="member-info">
                                <strong>${data.nome}</strong> - ${data.profissao}
                            </div>
                        </div>`;
                });
            } catch (e) {
                listaDiv.innerHTML = "Erro ao carregar membros.";
                console.error("Erro: ", e);
            }
        }

        window.enviarMensagem = async function() {
            const texto = document.getElementById("chat-texto").value;
            const fileInput = document.getElementById("chat-file-input");
            const file = fileInput.files[0];

            if (texto === "" && !file) {
                alert("Digite uma mensagem ou selecione uma imagem!");
                return;
            }

            let imagemBase64 = "";
            if (file) {
                comprimirImagem(file, async function(base64) {
                    salvarMensagemNoBanco(texto, base64);
                });
            } else {
                salvarMensagemNoBanco(texto, "");
            }
        };

        async function salvarMensagemNoBanco(texto, imagem) {
            try {
                await addDoc(collection(db, "chat"), {
                    texto: texto,
                    imagem: imagem,
                    timestamp: Date.now()
                });
                document.getElementById("chat-texto").value = "";
                document.getElementById("chat-file-input").value = "";
                carregarChat();
            } catch (e) {
                console.error("Erro ao enviar mensagem:", e);
            }
        }

        async function carregarChat() {
            const chatBox = document.getElementById("chat-box");
            try {
                const querySnapshot = await getDocs(collection(db, "chat"));
                let mensagens = [];
                querySnapshot.forEach((doc) => {
                    mensagens.push(doc.data());
                });
                mensagens.sort((a, b) => a.timestamp - b.timestamp);

                chatBox.innerHTML = "";
                mensagens.forEach((msg) => {
                    let imgHtml = msg.imagem ? `<br><img src="${msg.imagem}">` : "";
                    chatBox.innerHTML += `<div class="chat-msg">${msg.texto}${imgHtml}</div>`;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                console.error("Erro ao carregar chat:", e);
            }
        }

        function carregarTudo() {
            carregarFotoGrupo();
            carregarMembros();
            carregarChat();
        }
    </script>
</body>
</html>
