            <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo dos Melhores Amigos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #ff9800;
            color: white;
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #ff9800;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #e68900;
        }
        .member-list {
            text-align: left;
            margin-top: 20px;
        }
        .member-item {
            background: #fff3e0;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 5px solid #ff9800;
        }
    </style>
</head>
<body>

    <header>Grupo dos Melhores Amigos</header>

    <div id="login-screen" class="container">
        <h2>Digite a Senha do Grupo</h2>
        <input type="password" id="senha-input" placeholder="Senha de acesso">
        <button onclick="verificarSenha()">Entrar</button>
    </div>

    <div id="main-screen" class="container" style="display: none;">
        <h3>Grupo do Davi</h3>
        
        <div class="member-list">
            <h4>Membros do Grupo</h4>
            <input type="text" id="nome-input" placeholder="Nome do amigo">
            <input type="text" id="profissao-input" placeholder="Profissão do membro">
            <button onclick="adicionarMembro()">Adicionar Membro</button>
            
            <div id="lista-membros"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuração do Firebase (Substitua pelos seus dados do Firebase se criar um projeto próprio)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "seu-projeto.firebaseapp.com",
            projectId: "seu-projeto",
            storageBucket: "seu-projeto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.verificarSenha = function() {
            const senha = document.getElementById("senha-input").value;
            if (senha === "123456") { // Defina sua senha aqui
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-screen").style.display = "block";
                carregarMembros();
            } else {
                alert("Senha incorreta!");
            }
        };

        window.adicionarMembro = async function() {
            const nome = document.getElementById("nome-input").value;
            const profissao = document.getElementById("profissao-input").value;

            if (nome === "" || profissao === "") {
                alert("Preencha todos os campos!");
                return;
            }

            try {
                await addDoc(collection(db, "membros"), {
                    nome: nome,
                    profissao: profissao
                });
                document.getElementById("nome-input").value = "";
                document.getElementById("profissao-input").value = "";
                carregarMembros();
            } catch (e) {
                console.error("Erro ao adicionar membro: ", e);
            }
        };

        async function carregarMembros() {
            const listaDiv = document.getElementById("lista-membros");
            listaDiv.innerHTML = "Carregando...";
            
            try {
                const querySnapshot = await getDocs(collection(db, "membros"));
                listaDiv.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    listaDiv.innerHTML += `<div class="member-item"><strong>${data.nome}</strong> - ${data.profissao}</div>`;
                });
            } catch (e) {
                listaDiv.innerHTML = "Erro ao carregar membros.";
                console.error("Erro: ", e);
            }
        }
    </script>
</body>
</html>
