<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo dos Melhores Amigos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .header {
            background-color: #ff8c00;
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            margin: -20px -20px 20px -20px;
            cursor: pointer;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #ff8c00;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #e07b00;
        }
        .hidden {
            display: none;
        }
        #grupo-foto {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            display: none;
            border: 2px solid white;
        }
        ul {
            list-style-type: none;
            padding: 0;
            text-align: left;
        }
        li {
            background: #f9f9f9;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border-left: 4px solid #ff8c00;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tela de Login -->
        <div id="login-screen">
            <h2>Digite a Senha do Grupo</h2>
            <input type="password" id="senha-input" placeholder="Senha de acesso">
            <button onclick="verificarSenha()">Entrar</button>
        </div>

        <!-- Tela Principal do Grupo -->
        <div id="grupo-screen" class="hidden">
            <div class="header" onclick="mudarFotoGrupo()">
                <img id="grupo-foto" src="" alt="Foto do Grupo">
                <h1 id="titulo-grupo">Grupo dos Melhores Amigos</h1>
                <p>Grupo do Davi</p>
            </div>
            
            <h3>Membros do Grupo</h3>
            <input type="text" id="nome-membro" placeholder="Nome do amigo">
            <input type="text" id="profissao-membro" placeholder="Profissão do membro">
            <button onclick="adicionarMembro()">Adicionar Membro</button>

            <ul id="lista-membros"></ul>
        </div>
    </div>

    <input type="file" id="input-file-foto" accept="image/*" class="hidden" onchange="carregarFotoGrupo(event)">

    <script>
        function verificarSenha() {
            const senha = document.getElementById('senha-input').value;
            if (senha === "123Davi*") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('grupo-screen').classList.remove('hidden');
            } else {
                alert("Senha incorreta!");
            }
        }

        function mudarFotoGrupo() {
            document.getElementById('input-file-foto').click();
        }

        function carregarFotoGrupo(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    const foto = document.getElementById('grupo-foto');
                    foto.src = e.target.result;
                    foto.style.display = 'inline-block';
                }
                leitor.readAsDataURL(arquivo);
            }
        }

        function adicionarMembro() {
            const nomeInput = document.getElementById('nome-membro');
            const profissaoInput = document.getElementById('profissao-membro');
            const lista = document.getElementById('lista-membros');

            const nome = nomeInput.value.trim();
            const profissao = profissaoInput.value.trim();

            if (nome === "" || profissao === "") {
                alert("Por favor, preencha o nome e a profissão do membro!");
                return;
            }

            const item = document.createElement('li');
            item.innerHTML = `<strong>${nome}</strong> - ${profissao}`;
            lista.appendChild(item);

            nomeInput.value = "";
            profissaoInput.value = "";
        }
    </script>

</body>
</html>
